<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;" />
  <title>Rapor Masası</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="flex h-screen w-screen overflow-hidden">

        <aside id="sidebar"
           class="relative z-30 flex h-full w-60 shrink-0 flex-col border-r border-line bg-panel
                  transition-[width] duration-200 ease-out">

            <div class="flex h-14 shrink-0 items-center gap-2.5 border-b border-line px-4">
        <div class="flex size-7 shrink-0 items-center justify-center rounded-md bg-brand-2 text-black">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
               stroke-linecap="round" stroke-linejoin="round" class="size-4">
            <path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z" />
          </svg>
        </div>
        <div class="etiket min-w-0 leading-tight">
          <div class="truncate text-[13px] font-semibold">Rapor Masası</div>
          <div class="truncate text-[11px] text-fg-3">Günlük Kontrol</div>
        </div>
      </div>

            <button id="toggleSidebar" title="Menüyü daralt (Ctrl+B)"
              class="absolute -right-3 top-[44px] z-50 flex size-6 items-center justify-center
                     rounded-full border border-line-2 bg-panel-3 text-fg-2 shadow-md
                     transition-colors hover:border-brand-2 hover:text-brand">
        <svg id="toggleIkon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round" class="size-3.5 transition-transform duration-200">
          <path d="m15 18-6-6 6-6" />
        </svg>
      </button>

      <nav class="flex-1 space-y-0.5 overflow-y-auto p-2" id="menu"></nav>

      <div class="border-t border-line p-2">
        <button class="nav-item w-full" data-sayfa="ayarlar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3" />
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
          </svg>
          <span class="etiket">Ayarlar</span>
        </button>
        <div class="etiket px-2.5 pt-2 text-[10.5px] text-fg-3" id="surumEtiket">—</div>
      </div>
    </aside>

        <div class="flex min-w-0 flex-1 flex-col">

      <header class="flex h-14 shrink-0 items-center justify-between border-b border-line bg-panel px-5">
        <div class="min-w-0">
          <h1 id="sayfaBaslik" class="truncate text-[15px] font-semibold">Genel Bakış</h1>
          <p id="sayfaAlt" class="truncate text-[11.5px] text-fg-3">—</p>
        </div>
        <div class="flex items-center gap-2" id="navAraclar"></div>
      </header>

            <main id="icerik" class="flex min-h-0 flex-1 flex-col overflow-hidden bg-bg-100 p-5"></main>
    </div>
  </div>

    <div id="bildirimler" class="pointer-events-none fixed bottom-5 right-5 z-[100] flex w-96 flex-col gap-2"></div>

    <div id="panelKatman" class="fixed inset-0 z-[90] hidden bg-black/50"></div>
  <aside id="yanPanel"
         class="fixed right-0 top-0 z-[95] hidden h-full w-[440px] flex-col border-l border-line bg-panel shadow-2xl">
  </aside>

  <script type="module" src="app.js"></script>
</body>
</html>
